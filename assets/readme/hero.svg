<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="50%" stop-color="#0E121D" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanLimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#CCFF00" />
    </linearGradient>
    <linearGradient id="monadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#836EF9" />
      <stop offset="100%" stop-color="#4D35D9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141926" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Outer Glow Highlights -->
  <circle cx="150" cy="80" r="120" fill="#836EF9" opacity="0.08" filter="blur(40px)" />
  <circle cx="1050" cy="320" r="140" fill="#00E5FF" opacity="0.06" filter="blur(50px)" />

  <!-- Top Status Bar -->
  <g transform="translate(60, 45)">
    <rect width="330" height="28" rx="6" fill="#141824" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#00FF66" />
    <text x="30" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MONAD METROPOLIS • TRACK 01</text>

    <!-- Chain ID Tag -->
    <rect x="345" y="0" width="130" height="28" rx="6" fill="#1A1533" stroke="#836EF9" stroke-opacity="0.4" stroke-width="1" />
    <text x="357" y="18" fill="#836EF9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">CHAIN ID 10143</text>
  </g>

  <!-- Left Column: Title & Proposition -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="url(#cyanLimeGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">FLUXSTATE</text>
    <text x="0" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.2">Continuous 1-Second Block Funding Perpetuals</text>
    
    <text x="0" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" width="560">
      Sub-second funding settlement engineered natively for Monad Parallel EVM.
    </text>
    <text x="0" y="98" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" width="560">
      16-Shard write-isolated accumulator eliminates Block-STM state contention.
    </text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 140)">
      <rect width="130" height="42" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="14" y="18" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">CADENCE</text>
      <text x="14" y="34" fill="#00FF66" font-family="monospace" font-size="14" font-weight="800">1.0s / BLOCK</text>

      <g transform="translate(142, 0)">
        <rect width="130" height="42" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="14" y="18" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">BLOCK-STM</text>
        <text x="14" y="34" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="800">16 SHARDS</text>
      </g>

      <g transform="translate(284, 0)">
        <rect width="130" height="42" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="14" y="18" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">EXECUTION</text>
        <text x="14" y="34" fill="#CCFF00" font-family="monospace" font-size="14" font-weight="800">50ms 1-CLICK</text>
      </g>

      <g transform="translate(426, 0)">
        <rect width="130" height="42" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="14" y="18" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">KEEPER OVERHEAD</text>
        <text x="14" y="34" fill="#836EF9" font-family="monospace" font-size="14" font-weight="800">&lt; $0.0001 / TX</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Interactive 16-Shard Parallel Matrix Visualizer Specimen -->
  <g transform="translate(670, 75)">
    <!-- Terminal Shell Container -->
    <rect width="470" height="280" rx="12" fill="#0A0D15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Header of Shell -->
    <rect width="470" height="36" rx="12" fill="#121622" />
    <path d="M 0 36 L 470 36" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="70" y="22" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">BLOCK-STM // 16-SHARD PARALLEL STORAGE MATRIX</text>

    <!-- 16 Shard Cells (4x4 Grid) -->
    <g transform="translate(20, 52)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="10" y="18" fill="#64748B" font-family="monospace" font-size="9">SHARD #0</text>
      <text x="10" y="32" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <rect x="110" y="0" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="120" y="18" fill="#64748B" font-family="monospace" font-size="9">SHARD #1</text>
      <text x="120" y="32" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">32 TRADES</text>

      <!-- Active Shard Highlighted -->
      <rect x="220" y="0" width="100" height="42" rx="6" fill="#0F242A" stroke="#00E5FF" stroke-width="1.5" />
      <text x="230" y="18" fill="#00E5FF" font-family="monospace" font-size="9" font-weight="800">SHARD #2 [YOU]</text>
      <text x="230" y="32" fill="#CCFF00" font-family="monospace" font-size="11" font-weight="800">32 TRADES</text>

      <rect x="330" y="0" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="340" y="18" fill="#64748B" font-family="monospace" font-size="9">SHARD #3</text>
      <text x="340" y="32" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <!-- Row 1 -->
      <rect x="0" y="48" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="10" y="66" fill="#64748B" font-family="monospace" font-size="9">SHARD #4</text>
      <text x="10" y="80" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <rect x="110" y="48" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="120" y="66" fill="#64748B" font-family="monospace" font-size="9">SHARD #5</text>
      <text x="120" y="80" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <rect x="220" y="48" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="230" y="66" fill="#64748B" font-family="monospace" font-size="9">SHARD #6</text>
      <text x="230" y="80" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">32 TRADES</text>

      <rect x="330" y="48" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="340" y="66" fill="#64748B" font-family="monospace" font-size="9">SHARD #7</text>
      <text x="340" y="80" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <!-- Row 2 -->
      <rect x="0" y="96" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="10" y="114" fill="#64748B" font-family="monospace" font-size="9">SHARD #8</text>
      <text x="10" y="128" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <rect x="110" y="96" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="120" y="114" fill="#64748B" font-family="monospace" font-size="9">SHARD #9</text>
      <text x="120" y="128" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">32 TRADES</text>

      <rect x="220" y="96" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="230" y="114" fill="#64748B" font-family="monospace" font-size="9">SHARD #10</text>
      <text x="230" y="128" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <rect x="330" y="96" width="100" height="42" rx="6" fill="#111520" stroke="rgba(255,255,255,0.06)" />
      <text x="340" y="114" fill="#64748B" font-family="monospace" font-size="9">SHARD #11</text>
      <text x="340" y="128" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">31 TRADES</text>

      <!-- Row 3 (Summary Status Bar) -->
      <g transform="translate(0, 148)">
        <rect width="430" height="52" rx="6" fill="#0C101A" stroke="rgba(255,255,255,0.08)" />
        <circle cx="16" cy="26" r="4" fill="#CCFF00" />
        <text x="30" y="22" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700">500 PARALLEL ORDERS IN 1 BLOCK</text>
        <text x="30" y="38" fill="#94A3B8" font-family="monospace" font-size="10">WRITE COLLISION ABORTS: <tspan fill="#00FF66" font-weight="700">0.00%</tspan> • SPEED: <tspan fill="#CCFF00" font-weight="700">6,100 TPS</tspan></text>
      </g>
    </g>
  </g>
</svg>
