<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1447"/>
      <stop offset="50%" stop-color="#110B29"/>
      <stop offset="100%" stop-color="#080417"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3B2D71" stroke-width="2"/>
  
  <!-- Outer Energy Circuit Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>
  
  <!-- Parallel Speed Accent Line (Monad Cyan) -->
  <path d="M12 48 L22 48" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 16 L52 16" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- High-Frequency Lightning Bolt (FluxState Symbol) -->
  <path d="M35 10 L19 33 L31 33 L25 54 L45 29 L33 29 Z" 
        fill="url(#boltGrad)" 
        stroke="#FFFFFF" 
        stroke-width="1" 
        filter="url(#neonGlow)"
        stroke-linejoin="round"/>
        
  <!-- Core Sub-second Pulse Ping -->
  <circle cx="33" cy="29" r="2" fill="#FFFFFF"/>
</svg>
